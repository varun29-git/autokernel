[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminus-autokernel"
version = "0.1.0"
description = "Evidence-driven kernel search for complete model training"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pydantic>=2.8,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
autokernel = "autokernel.cli:main"

[tool.setuptools.packages.find]
include = ["autokernel*"]

[tool.setuptools.package-data]
autokernel = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
