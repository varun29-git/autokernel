name: CPU framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check autokernel tests
      - run: pytest -q
      - run: autokernel demo --store artifacts/ci-demo --include-wrong
      - run: autokernel verify-store --store artifacts/ci-demo
